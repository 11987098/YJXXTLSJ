<script>
const cvSec = document.getElementById('cvSection');
const cvCur = document.getElementById('cvCurve');
const ctxS = cvSec.getContext('2d');
const ctxC = cvCur.getContext('2d');
let points = [];          // {c,x} from G-code
let curC = 0, playing = true, speed = 24, lastT = null;

/* ---------- canvas sizing (HiDPI) ---------- */
function fitCanvas(cv){
  const dpr = window.devicePixelRatio || 1;
  const cssW = cv.clientWidth;
  const cssH = cv.id === 'cvSection' ? 420 : 250;
  cv.style.height = cssH + 'px';
  cv.width = Math.round(cssW * dpr);
  cv.height = Math.round(cssH * dpr);
  cv.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
  return {w:cssW, h:cssH};
}
let sizeS, sizeC;
function resizeAll(){ sizeS = fitCanvas(cvSec); sizeC = fitCanvas(cvCur); }
window.addEventListener('resize', () => { resizeAll(); drawSection(curC); drawCurve(getCurvePoints()); });

/* ---------- parameters ---------- */
function getParams(){
  const D=parseFloat(document.getElementById('pD').value);
  const L1=parseFloat(document.getElementById('pL1').value);
  const L2=parseFloat(document.getElementById('pL2').value);
  const R=parseFloat(document.getElementById('pR').value);
  const WheelD=parseFloat(document.getElementById('pWheelD').value);
  return {D,L1,L2,R,WheelD,
          hx:L2/2, hy:L1/2, rw:WheelD/2};
}
function refreshLabels(){
  const p=getParams();
  document.getElementById('title').innerText =
    `磨床 C-X G代码轨迹预览 | 参数：D=${p.D} L1=${p.L1} L2=${p.L2} R=${p.R} 砂轮Φ${p.WheelD}`;
  document.getElementById('whLbl').innerText = p.WheelD;
  document.getElementById('blankLbl').innerText = p.D;
}
document.querySelectorAll('.param-item input').forEach(el=>el.addEventListener('input',()=>{
  refreshLabels();
  if(points.length===0){ drawSection(curC); drawCurve(getCurvePoints()); }
}));

/* ---------- G-code parsing ---------- */
function parseGcode(){
  const txt = document.getElementById('gcodeText').value;
  const out=[];
  for(const chunk of txt.split(/[;\n]/)){
    const xm=chunk.match(/X([+-]?\d+\.?\d*)/);
    const cm=chunk.match(/C([+-]?\d+\.?\d*)/);
    if(xm && cm) out.push({c:parseFloat(cm[1]), x:parseFloat(xm[1])});
  }
  out.sort((u,v)=>u.c-v.c);
  points = out;
  drawSection(curC);
  drawCurve(getCurvePoints());
  document.getElementById('msg').innerText = points.length
    ? `解析成功：${points.length} 个坐标点，C ${points[0].c}~${points[points.length-1].c}，X ${Math.min(...points.map(p=>p.x))}~${Math.max(...points.map(p=>p.x))}`
    : 'G代码为空，截面图改用参数理论轨迹';
}

/* ---------- theoretical X(C): wheel-offset model ---------- */
function foldFirstQuadrant(deg){
  let a=((deg%360)+360)%360;
  if(a>270) a=360-a;
  else if(a>180) a=a-180;
  else if(a>90) a=180-a;
  return a*Math.PI/180;
}
// wheel-center distance d for body-frame ray psi (first quadrant), rounded rect half a,b corner R, wheel rw
function dOnOffset(psi,p){
  const ux=Math.cos(psi), uy=Math.sin(psi);
  const R=Math.min(p.R,p.hx,p.hy);
  // right straight offset segment x = hx+rw, y in [-(hy-R), hy-R]
  if(Math.abs(ux)>1e-12){
    const t=(p.hx+p.rw)/ux, y=t*uy;
    if(t>0 && Math.abs(y)<=(p.hy-R)+1e-9) return t;
  }
  // top straight offset segment y = hy+rw, x in [-(hx-R), hx-R]
  if(Math.abs(uy)>1e-12){
    const t=(p.hy+p.rw)/uy, x=t*ux;
    if(t>0 && Math.abs(x)<=(p.hx-R)+1e-9) return t;
  }
  // corner offset arc, center (hx-R,hy-R), radius R+rw
  const cx=p.hx-R, cy=p.hy-R, ro=R+p.rw;
  const cu=cx*ux+cy*uy;
  const disc=ro*ro-(cx*cx+cy*cy)+cu*cu;
  return cu+Math.sqrt(Math.max(0,disc));
}
function Xtheory(C,p){
  const psi=foldFirstQuadrant(-C);
  return 2*(dOnOffset(psi,p)-p.rw);
}
function getX(C){
  if(points.length>=2){
    let lo=points[0], hi=points[points.length-1];
    if(C<=lo.c) return lo.x;
    if(C>=hi.c) return hi.x;
    for(let i=0;i<points.length-1;i++){
      const a=points[i], b=points[i+1];
      if(C>=a.c && C<=b.c){
        const f=(C-a.c)/((b.c-a.c)||1);
        return a.x+(b.x-a.x)*f;
      }
    }
  }
  return Xtheory(C,getParams());
}
function getCurvePoints(){
  if(points.length>=2) return points;
  const p=getParams(), arr=[];
  for(let c=0;c<=360.0001;c+=1) arr.push({c, x:Xtheory(c,p)});
  return arr;
}

/* ---------- rounded-rect profile vertices (body frame) ---------- */
function profileVerts(p){
  const hx=p.hx,hy=p.hy,R=Math.min(p.R,p.hx,p.hy), v=[];
  const arcN=36, lineN=32;
  function line(x1,y1,x2,y2){
    for(let i=0;i<=lineN;i++){ const f=i/lineN; v.push({x:x1+(x2-x1)*f, y:y1+(y2-y1)*f}); }
  }
  function arc(cx,cy,a0,a1){
    for(let i=0;i<=arcN;i++){
      const t=a0+(a1-a0)*i/arcN;
      v.push({x:cx+R*Math.cos(t), y:cy+R*Math.sin(t)});
    }
  }
  // body x = short half hx (faces wheel at C=0); body y = long half hy
  line(hx,-(hy-R), hx,hy-R);                                   // right edge (3,-5)->(3,5)
  arc(hx-R,hy-R,0,Math.PI/2);                                  // top-right corner
  line(hx-R,hy,-(hx-R),hy);                                    // top edge
  arc(-(hx-R),hy-R,Math.PI/2,Math.PI);                         // top-left corner
  line(-hx,hy-R,-hx,-(hy-R));                                  // left edge
  arc(-(hx-R),-(hy-R),Math.PI,Math.PI*1.5);                    // bottom-left corner
  line(-(hx-R),-hy,hx-R,-hy);                                  // bottom edge
  arc(hx-R,-(hy-R),Math.PI*1.5,Math.PI*2);                     // bottom-right corner
  return v;
}
function rotPt(pt,C){
  const r=C*Math.PI/180,c=Math.cos(r),s=Math.sin(r);
  return {x:pt.x*c-pt.y*s, y:pt.x*s+pt.y*c};
}

/* ---------- section view ---------- */
// geometry (independent of camera): wheel center, rotated profile, contact point
function sceneGeometry(p,view,C){
  const X=getX(C), d=p.rw+X/2;
  let wheelC, profC;
  if(view==='machine'){ wheelC={x:d,y:0}; profC=C; }
  else { wheelC={x:d*Math.cos(C*Math.PI/180), y:-d*Math.sin(C*Math.PI/180)}; profC=0; }
  const prof=profileVerts(p).map(pt=>rotPt(pt,profC));
  let best=null,bd=1e18;
  for(const pt of prof){
    const dx=pt.x-wheelC.x, dy=pt.y-wheelC.y, dd=dx*dx+dy*dy;
    if(dd<bd){bd=dd;best=pt;}
  }
  return {X,d,wheelC,prof,best,bd,view};
}
// paint the same scene through a camera defined by world bounds, clipped to a pixel rect
function paintScene(clip,bounds,geo,p,showTraj){
  const cw=clip?clip.w:sizeS.w, ch=clip?clip.h:sizeS.h;
  const scale=Math.min(cw/(bounds.xmax-bounds.xmin), ch/(bounds.ymax-bounds.ymin));
  const leftPad=(cw-(bounds.xmax-bounds.xmin)*scale)/2, topPad=(ch-(bounds.ymax-bounds.ymin)*scale)/2;
  const ox=leftPad-bounds.xmin*scale, oy=topPad+bounds.ymax*scale;
  const w2s=(x,y)=>({x:ox+x*scale,y:oy-y*scale});
  ctxS.save();
  if(clip){ ctxS.beginPath(); ctxS.rect(clip.x,clip.y,clip.w,clip.h); ctxS.clip();
    ctxS.fillStyle='#fff'; ctxS.fillRect(clip.x,clip.y,clip.w,clip.h);
    ctxS.translate(clip.x,clip.y);
    // rebase w2s into clipped area
    const w2=(x,y)=>({x:ox+x*scale,y:oy-y*scale});
    doPaint(w2,scale,geo,p,showTraj);
  } else { doPaint(w2s,scale,geo,p,showTraj); }
  ctxS.restore();
}
function doPaint(w2s,scale,geo,p,showTraj){
  const view=geo.view;
  // wheel-center trajectory
  if(showTraj && document.getElementById('trajChk').checked){
    ctxS.strokeStyle='#f3a35c'; ctxS.lineWidth=1.5; ctxS.setLineDash([5,4]); ctxS.beginPath();
    getCurvePoints().forEach((q,i)=>{
      const dd=p.rw+q.x/2; let wx,wy;
      if(view==='machine'){wx=dd;wy=0;} else {wx=dd*Math.cos(q.c*Math.PI/180);wy=-dd*Math.sin(q.c*Math.PI/180);}
      const s=w2s(wx,wy); i?ctxS.lineTo(s.x,s.y):ctxS.moveTo(s.x,s.y);
    });
    ctxS.stroke(); ctxS.setLineDash([]);
  }
  // blank cylinder
  const bo=w2s(0,0);
  ctxS.beginPath(); ctxS.arc(bo.x,bo.y,p.D/2*scale,0,Math.PI*2);
  ctxS.fillStyle='rgba(190,198,210,0.18)'; ctxS.fill();
  ctxS.strokeStyle='#9aa4b1'; ctxS.lineWidth=1; ctxS.stroke();
  // finished profile
  ctxS.beginPath();
  geo.prof.forEach((pt,i)=>{const s=w2s(pt.x,pt.y); i?ctxS.lineTo(s.x,s.y):ctxS.moveTo(s.x,s.y);});
  ctxS.closePath();
  ctxS.fillStyle='rgba(37,99,235,0.16)'; ctxS.fill();
  ctxS.strokeStyle='#2563eb'; ctxS.lineWidth=2; ctxS.stroke();
  // wheel
  const ws=w2s(geo.wheelC.x,geo.wheelC.y);
  ctxS.beginPath(); ctxS.arc(ws.x,ws.y,p.rw*scale,0,Math.PI*2);
  ctxS.fillStyle='rgba(234,88,12,0.13)'; ctxS.fill();
  ctxS.strokeStyle='#ea580c'; ctxS.lineWidth=2; ctxS.stroke();
  ctxS.beginPath(); ctxS.arc(ws.x,ws.y,2.5,0,Math.PI*2); ctxS.fillStyle='#ea580c'; ctxS.fill();
  // contact point + normal
  const cs=w2s(geo.best.x,geo.best.y);
  ctxS.strokeStyle='rgba(239,68,68,0.55)'; ctxS.lineWidth=1;
  ctxS.beginPath(); ctxS.moveTo(cs.x,cs.y); ctxS.lineTo(ws.x,ws.y); ctxS.stroke();
  ctxS.beginPath(); ctxS.arc(cs.x,cs.y,3.5,0,Math.PI*2); ctxS.fillStyle='#ef4444'; ctxS.fill();
  // center crosshair
  ctxS.strokeStyle='#c3ccd8'; ctxS.lineWidth=1;
  ctxS.beginPath(); ctxS.moveTo(bo.x-6,bo.y);ctxS.lineTo(bo.x+6,bo.y);
  ctxS.moveTo(bo.x,bo.y-6);ctxS.lineTo(bo.x,bo.y+6);ctxS.stroke();
}
function drawSection(C){
  const W=sizeS.w,H=sizeS.h;
  ctxS.clearRect(0,0,W,H);
  const p=getParams(), view=document.getElementById('viewSel').value;
  const geo=sceneGeometry(p,view,C);
  const mrg=Math.max(2,p.rw*0.05);
  let main;
  if(view==='machine'){
    main={xmin:-p.D/2-mrg,xmax:2*p.rw+geo.X/2+mrg,ymin:-(p.rw+mrg),ymax:p.rw+mrg};
  }else{
    const half=p.rw+Math.max(p.hx,p.hy)+mrg;
    main={xmin:-half,xmax:half,ymin:-half,ymax:half};
  }
  paintScene(null,main,geo,p,true);

  // inset: zoomed contact area (keeps workpiece center and contact point both visible)
  const rc=Math.hypot(geo.best.x,geo.best.y);
  const ccx=geo.best.x/2, ccy=geo.best.y/2, half=rc+p.D/2+3;
  const iw=Math.min(230,W*0.42), ih=Math.min(200,H*0.5);
  const clip={x:8,y:H-ih-8,w:iw,h:ih};
  paintScene(clip,{xmin:ccx-half,xmax:ccx+half,ymin:ccy-half,ymax:ccy+half},geo,p,false);
  ctxS.strokeStyle='#c2410c'; ctxS.lineWidth=1.5;
  ctxS.strokeRect(clip.x,clip.y,clip.w,clip.h);
  ctxS.fillStyle='#c2410c'; ctxS.font='12px sans-serif';
  ctxS.fillText('接触区局部放大', clip.x+8, clip.y+16);

  document.getElementById('cLbl').innerText=`C ${C.toFixed(1)}°`;
  document.getElementById('slider').value=C;
  document.getElementById('hud').innerHTML =
    `C=<b>${C.toFixed(1)}°</b>　X=<b>${geo.X.toFixed(4)}</b>（直径）　砂轮中心距 d=<b>${geo.d.toFixed(4)}</b> mm　接触点到砂轮中心=${Math.sqrt(geo.bd).toFixed(3)} mm（≈砂轮半径${p.rw}）`;
}

/* ---------- X-C expanded curve ---------- */
function drawCurve(pts){
  const W=sizeC.w,H=sizeC.h;
  ctxC.clearRect(0,0,W,H);
  if(pts.length<2) return;
  let minC=1e18,maxC=-1e18,minX=1e18,maxX=-1e18;
  for(const q of pts){minC=Math.min(minC,q.c);maxC=Math.max(maxC,q.c);minX=Math.min(minX,q.x);maxX=Math.max(maxX,q.x);}
  const pad=38;
  const sC=(W-pad*2)/((maxC-minC)||1), sX=(H-pad*2)/((maxX-minX)||1);
  const sx=c=>pad+(c-minC)*sC, sy=x=>H-pad-(x-minX)*sX;
  ctxC.strokeStyle='#b7c0cc'; ctxC.lineWidth=1;
  ctxC.beginPath(); ctxC.moveTo(pad,H-pad); ctxC.lineTo(W-pad,H-pad); ctxC.stroke();
  ctxC.beginPath(); ctxC.moveTo(pad,pad); ctxC.lineTo(pad,H-pad); ctxC.stroke();
  // grid labels every 90 deg
  ctxC.fillStyle='#8a94a3'; ctxC.font='11px sans-serif';
  for(let c=0;c<=360;c+=90){ ctxC.fillText(c+'°', sx(c)-8,H-pad+16); }
  ctxC.strokeStyle='#2563eb'; ctxC.lineWidth=2; ctxC.beginPath();
  pts.forEach((q,i)=>{ i?ctxC.lineTo(sx(q.c),sy(q.x)):ctxC.moveTo(sx(q.c),sy(q.x)); });
  ctxC.stroke();
  ctxC.fillStyle='#33415c'; ctxC.font='12px sans-serif';
  ctxC.fillText(`C 角度：${minC.toFixed(1)} ~ ${maxC.toFixed(1)}`, pad, 16);
  ctxC.fillText(`X：${minX.toFixed(3)} ~ ${maxX.toFixed(4)}`, pad, 30);
}

/* ---------- buttons / animation ---------- */
function togglePlay(){
  playing=!playing;
  document.getElementById('btnPlay').innerText=playing?'暂停':'播放';
  lastT=null;
}
function resetAnim(){ curC=0; drawSection(0); }
function onSlider(){ curC=parseFloat(document.getElementById('slider').value); drawSection(curC); }
function onViewChange(){ drawSection(curC); }
function onSpeedChange(){ speed=parseFloat(document.getElementById('speedSel').value); }
function copyGcode(){
  const t=document.getElementById('gcodeText'); t.select();
  navigator.clipboard.writeText(t.value);
  document.getElementById('msg').innerText='已复制 G 代码到剪贴板';
}
function clearGcode(){
  document.getElementById('gcodeText').value='';
  points=[];
  drawSection(curC); drawCurve(getCurvePoints());
  document.getElementById('msg').innerText='已清空 G 代码，截面图改用参数理论轨迹';
}
function tick(t){
  if(playing){
    if(lastT==null) lastT=t;
    const dt=(t-lastT)/1000; lastT=t;
    curC=(curC+speed*dt)%360;
    drawSection(curC);
  } else lastT=null;
  requestAnimationFrame(tick);
}

/* ---------- init ---------- */
resizeAll();
refreshLabels();
parseGcode();
requestAnimationFrame(tick);
</script>
